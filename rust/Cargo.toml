[workspace]
resolver = "2"
members = ["crates/sniff-core", "crates/sniff-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["JohnRenatoDev"]
repository = "https://github.com/JohnRenatoDev/sniff-cleaner"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rustix = { version = "1.1.5", features = ["fs", "process"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
